<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SODDU SHOP 대시보드</title>
<meta name="theme-color" content="#4aa3f7">
<meta name="description" content="티켓, 환영 메시지, 자동응답, 구매 통계를 한 곳에서 관리하는 릴리웨이 대시보드">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root {
  --sky1: #a9d8ff; --sky2: #cdeaff; --sky3: #eaf6ff;
  --blue: #3d9bf5; --blue-d: #2f86e8; --navy: #1d3a66; --muted: #6a88aa;
  --card: rgba(255, 255, 255, 0.8); --line: rgba(120, 180, 240, 0.5);
  --danger: #e0457f; --ok: #12a86b; --warn: #d97706;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  color: var(--navy);
  background:
    radial-gradient(900px 420px at 85% -5%, rgba(255,255,255,.9), transparent 60%),
    radial-gradient(700px 380px at 5% 105%, rgba(255,255,255,.8), transparent 60%),
    linear-gradient(180deg, var(--sky1), var(--sky2) 45%, var(--sky3));
  background-attachment: fixed;
}
body::before, body::after {
  content: ""; position: fixed; pointer-events: none; z-index: 0;
  background: #fff; border-radius: 999px; filter: blur(2px); opacity: .75;
  box-shadow: 120px 30px 0 -10px #fff, 260px 10px 0 -20px #fff, -110px 24px 0 -14px #fff;
}
body::before { width: 260px; height: 70px; left: 6%; bottom: 8%; }
body::after  { width: 220px; height: 60px; right: 8%; top: 14%; opacity: .6; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--blue-d); }

/* 상단 */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 10px 28px; background: rgba(255,255,255,.72); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { font-weight: 800; font-size: 19px; letter-spacing: .4px; display: flex; align-items: center; gap: 10px; cursor: pointer; white-space: nowrap; }
.brand img { width: 36px; height: 36px; border-radius: 10px; box-shadow: 0 3px 10px rgba(61,155,245,.35); }
.brand small { font-weight: 600; color: var(--muted); font-size: 13px; letter-spacing: 0; }
.toplinks { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.toplinks a, .toplinks button { text-decoration: none; color: var(--navy); font-weight: 600; font-size: 14px; padding: 8px 12px; border-radius: 10px; border: 0; background: transparent; cursor: pointer; white-space: nowrap; }
.toplinks a:hover, .toplinks button:hover { background: rgba(61,155,245,.12); }
.who { display: flex; align-items: center; gap: 8px; font-weight: 600; margin: 0 8px 0 14px; }
.who img { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff; }
.who span { white-space: nowrap; max-width: 130px; overflow: hidden; text-overflow: ellipsis; }

.wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 28px 22px 130px; }
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .top { padding: 10px 14px; } .toplinks .opt { display: none; } .brand small { display: none; }
  .wrap { padding: 16px 12px 130px; } .who span { display: none; }
  .side { position: static !important; padding: 12px; } .side .g { display: none; } .nav { flex-direction: row !important; flex-wrap: nowrap; overflow-x: auto; } .nav button { white-space: nowrap; padding: 9px 12px; } .nav .sec { display: none; }
}

.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px; box-shadow: 0 8px 30px rgba(70, 130, 210, .12); backdrop-filter: blur(6px); }
.card + .card { margin-top: 16px; }
.side { position: sticky; top: 78px; }
.side .g { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; margin-bottom: 10px; border-bottom: 1px solid var(--line); }
.gicon { width: 46px; height: 46px; border-radius: 14px; background: linear-gradient(135deg,#7cc4ff,#3d9bf5); color: #fff; display: grid; place-items: center; font-weight: 800; overflow: hidden; flex: none; }
.gicon img { width: 100%; height: 100%; object-fit: cover; }
.g b { display: block; line-height: 1.25; word-break: break-all; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav .sec { font-size: 12px; font-weight: 700; color: var(--muted); padding: 10px 14px 4px; }
.nav button { text-align: left; border: 0; background: transparent; padding: 10px 14px; border-radius: 12px; cursor: pointer; font-weight: 600; color: var(--muted); }
.nav button:hover { background: rgba(61,155,245,.1); }
.nav button.on { background: linear-gradient(135deg,#7cc4ff,#3d9bf5); color: #fff; }

h1 { margin: 0 0 4px; font-size: 28px; }
h2 { margin: 0 0 6px; font-size: 21px; }
h3 { margin: 0; font-size: 17px; }
.muted { color: var(--muted); font-size: 14px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.gap { margin-top: 18px; }

.btn { border: 0; cursor: pointer; border-radius: 12px; padding: 10px 18px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #7cc4ff, #3d9bf5); box-shadow: 0 4px 14px rgba(61,155,245,.35); text-decoration: none; display: inline-block; }
.btn:hover { filter: brightness(1.05); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.ghost { background: rgba(255,255,255,.85); color: var(--navy); box-shadow: none; border: 1px solid var(--line); }
.btn.danger { color: var(--danger); }
.btn.dc { background: #5865f2; box-shadow: 0 4px 14px rgba(88,101,242,.35); }
.btn.sm { padding: 7px 13px; font-size: 14px; }
.btn.big { padding: 14px 26px; font-size: 17px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.grid.s { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.card.srv { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.card.srv + .card { margin-top: 0; }
.srv .gicon { width: 72px; height: 72px; border-radius: 22px; font-size: 26px; }

.pcard { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-top: 14px; }
.tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: rgba(61,155,245,.14); color: var(--blue-d); white-space: nowrap; }
.tag.ok { background: rgba(18,168,107,.14); color: var(--ok); }
.tag.off { background: rgba(106,136,170,.16); color: var(--muted); }
.tag.warn { background: rgba(217,119,6,.14); color: var(--warn); }
.tag.bad { background: rgba(224,69,127,.14); color: var(--danger); }

.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid rgba(120,180,240,.3); vertical-align: top; }
th { color: var(--muted); font-weight: 600; white-space: nowrap; }
td.num, th.num { text-align: right; white-space: nowrap; }
tr.click { cursor: pointer; } tr.click:hover td { background: rgba(61,155,245,.07); }
.ua { max-width: 240px; color: var(--muted); font-size: 12px; word-break: break-all; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 18px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 11px 18px; font-weight: 700; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--blue-d); border-bottom-color: var(--blue); }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 980px) { .cols { grid-template-columns: 1fr; } }
.cols .card + .card { margin-top: 0; }
.field { margin-bottom: 16px; }
.field > label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 14px; }
.field .hint, .hint { color: var(--muted); font-size: 12.5px; margin-top: 5px; line-height: 1.5; }
input[type=text], input[type=url], input[type=number], input[type=password], input[type=search], select, textarea {
  width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.92); outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(61,155,245,.18); }
textarea { min-height: 100px; resize: vertical; }
input[type=color] { width: 46px; height: 42px; padding: 2px; border-radius: 10px; border: 1px solid var(--line); background: #fff; cursor: pointer; flex: none; }
.inline { display: flex; gap: 10px; align-items: center; }
.sw { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.7); margin-bottom: 10px; cursor: pointer; }
.sw input { width: 18px; height: 18px; accent-color: var(--blue); flex: none; }
.sw b { display: block; font-size: 14px; }
.sw span { color: var(--muted); font-size: 12.5px; }
.seg { display: flex; gap: 8px; margin-bottom: 16px; }
.seg label { flex: 1; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; background: rgba(255,255,255,.7); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.seg label.on { border-color: var(--blue); background: rgba(61,155,245,.12); color: var(--blue-d); }
.seg input { accent-color: var(--blue); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: rgba(255,255,255,.85); border-radius: 999px; padding: 6px 13px; font-size: 13.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.chip i { width: 10px; height: 10px; border-radius: 50%; background: #99aab5; display: inline-block; }
.chip.on { background: linear-gradient(135deg,#7cc4ff,#3d9bf5); color: #fff; border-color: transparent; }

.qcard { border: 1px solid var(--line); border-radius: 16px; padding: 14px; background: rgba(255,255,255,.7); margin-bottom: 12px; }
.qcard .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: 700; gap: 8px; }
.qcard .tools { display: flex; gap: 6px; flex: none; }
.qcard .tools button { border: 1px solid var(--line); background: #fff; border-radius: 8px; width: 32px; height: 30px; cursor: pointer; }
.qcard .qcard { background: rgba(234,246,255,.7); }

.stat { padding: 16px 18px; }
.stat .k { color: var(--muted); font-size: 13px; font-weight: 600; }
.stat .v { font-size: 26px; font-weight: 800; margin-top: 4px; }
.stat .s { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 170px; padding-top: 10px; }
.bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
.bars .b i { display: block; width: 100%; max-width: 34px; border-radius: 8px 8px 3px 3px; background: linear-gradient(180deg,#7cc4ff,#3d9bf5); min-height: 3px; }
.bars .b span { font-size: 11px; color: var(--muted); margin-top: 6px; white-space: nowrap; }
.person { display: flex; align-items: center; gap: 10px; }
.person img, .person .ph { width: 34px; height: 34px; border-radius: 50%; background: #cfe4fa; flex: none; object-fit: cover; }

/* 디스코드 미리보기 */
.dc { background: #313338; border-radius: 16px; padding: 18px; color: #dbdee1; font-family: "gg sans", "Noto Sans", "Malgun Gothic", sans-serif; }
.dc + .dc { margin-top: 12px; }
.dc .msg { display: flex; gap: 14px; }
.dc .av { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg,#7cc4ff,#3d9bf5); flex: none; }
.dc .nm { font-weight: 600; color: #fff; margin-bottom: 4px; }
.dc .nm span { background: #5865f2; font-size: 10px; padding: 1px 5px; border-radius: 4px; margin-left: 6px; vertical-align: 2px; }
.dc .ct { font-size: 14px; margin-bottom: 4px; word-break: break-word; }
.dc .emb { background: #2b2d31; border-left: 4px solid var(--blue); border-radius: 6px; padding: 10px 14px 12px; max-width: 440px; position: relative; margin-bottom: 4px; }
.dc .emb .t { font-weight: 700; color: #fff; margin-bottom: 6px; font-size: 16px; word-break: break-word; }
.dc .emb .d { font-size: 14px; line-height: 1.4; word-break: break-word; }
.dc .emb .fl { margin-top: 8px; font-size: 14px; } .dc .emb .fl b { display: block; color: #fff; }
.dc .emb img.im { width: 100%; border-radius: 6px; margin-top: 10px; display: block; }
.dc .emb img.th { position: absolute; right: 12px; top: 12px; width: 64px; height: 64px; border-radius: 50%; object-fit: cover; }
.dc .emb.hasth { padding-right: 90px; }
.dc .emb .f { font-size: 12px; color: #b5bac1; margin-top: 10px; }
.dc .b { display: inline-flex; align-items: center; gap: 6px; margin: 6px 6px 0 0; padding: 6px 16px; border-radius: 4px; font-weight: 600; font-size: 14px; color: #fff; background: #5865f2; }
.dc .b.Secondary { background: #4e5058; } .dc .b.Success { background: #248046; } .dc .b.Danger { background: #da373c; }
.dc .sel { margin-top: 8px; background: #1e1f22; border: 1px solid #1e1f22; border-radius: 4px; padding: 9px 12px; display: flex; justify-content: space-between; max-width: 440px; color: #b5bac1; font-size: 14px; }
.dc .opts { margin-top: 4px; background: #2b2d31; border: 1px solid #1e1f22; border-radius: 4px; max-width: 440px; padding: 4px; }
.dc .opts div { padding: 7px 10px; border-radius: 4px; font-size: 14px; color: #fff; } .dc .opts small { display: block; color: #b5bac1; font-size: 12px; }
.dc .opts div:hover { background: #35373c; }

.savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 12px 22px; display: flex; justify-content: center; }
.savebar .in { width: 100%; max-width: 1136px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  background: rgba(255,255,255,.93); border: 1px solid var(--line); border-radius: 18px; padding: 12px 18px; box-shadow: 0 10px 34px rgba(70,130,210,.25); }
.savebar .st { font-weight: 600; color: var(--muted); }
.savebar.dirty .st { color: var(--warn); }
.toast { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); z-index: 60; background: var(--navy); color: #fff; padding: 11px 20px; border-radius: 999px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: 92vw; text-align: center; }
.toast.err { background: var(--danger); }
.empty { text-align: center; color: var(--muted); padding: 26px 10px; }
.notice { border: 1px solid rgba(217,119,6,.4); background: rgba(255,244,222,.85); border-radius: 14px; padding: 12px 16px; margin-bottom: 16px; font-size: 14px; }

/* 첫 화면 */
.hero { text-align: center; padding: 44px 10px 30px; }
.hero .logo { width: 104px; height: 104px; border-radius: 28px; box-shadow: 0 14px 40px rgba(61,155,245,.4); }
.hero h1 { font-size: 40px; margin: 22px 0 10px; line-height: 1.2; }
.hero p.lead { font-size: 18px; color: var(--muted); max-width: 560px; margin: 0 auto 26px; line-height: 1.6; }
.hero .cta { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.landing { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 26px; align-items: start; margin-top: 10px; }
@media (max-width: 900px) { .landing { grid-template-columns: 1fr; } .hero h1 { font-size: 30px; } }
.feat { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-top: 30px; }
.feat .card { padding: 18px; } .feat .card + .card { margin-top: 0; }
.feat .ic { font-size: 26px; } .feat b { display: block; margin: 8px 0 4px; } .feat span { color: var(--muted); font-size: 13.5px; line-height: 1.5; }
.authcard h2 { margin-bottom: 14px; }
.err { color: var(--danger); font-size: 13.5px; font-weight: 600; min-height: 20px; margin: 6px 0; }
.sep { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin: 16px 0; }
.sep::before, .sep::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.foot { text-align: center; color: var(--muted); font-size: 13px; margin-top: 40px; line-height: 1.8; }
.foot a { color: var(--muted); }
</style>
</head>
<body>
<div id="top"></div>
<div class="wrap" id="app"></div>
<div id="bar"></div>
<div id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const getP = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
const setP = (o, p, v) => { const ks = p.split('.'); const l = ks.pop(); ks.reduce((a, k) => a[k], o)[l] = v; };
const rid = () => Array.from(crypto.getRandomValues(new Uint8Array(5)), (b) => b.toString(16).padStart(2, '0')).join('');
const fmtN = (n) => Number(n || 0).toLocaleString('ko-KR');
const fmtT = (ts) => (ts ? new Date(ts).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', hour12: false, month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', year: '2-digit' }) : '-');
const fmtD = (ts) => (ts ? new Date(ts).toLocaleDateString('ko-KR', { timeZone: 'Asia/Seoul', year: 'numeric', month: 'long', day: 'numeric' }) : '-');
const safeUrl = (u) => (/^https?:\/\//.test(u || '') ? esc(u) : '');
const ext = (u) => (u ? `href="${safeUrl(u)}" target="_blank" rel="noopener noreferrer"` : 'href="#" onclick="return false" style="opacity:.5"');

const state = { pub: null, me: null, guilds: [], gid: null, data: null, page: 'home', pid: null, tab: 'message', wtab: 'welcome', dirty: false, busy: false, cache: {}, auth: 'login' };

async function api(path, opts = {}) {
  const r = await fetch(path, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'dashboard' }, ...opts });
  if (r.status === 401 && !path.startsWith('/api/auth/')) { state.me = null; state.data = null; render(); throw new Error('login'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || '오류가 났어요.');
  return j;
}

let toastTimer;
function toast(msg, err) {
  $('#toast').innerHTML = `<div class="toast ${err ? 'err' : ''}">${esc(msg)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => ($('#toast').innerHTML = ''), 3400);
}

// ---------- 라우팅 ----------
function go(hash) {
  if (state.dirty && !confirm('저장하지 않은 변경사항이 있어요. 그래도 이동할까요?')) return;
  state.dirty = false;
  if (location.hash === hash) route(); else location.hash = hash;
}
window.addEventListener('hashchange', route);
window.addEventListener('beforeunload', (e) => { if (state.dirty) { e.preventDefault(); e.returnValue = ''; } });

function route() {
  const h = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  state.gid = null; state.pid = null; state.page = 'home';
  if (h[0] === 'account') state.page = 'account';
  else if (h[0] === 'admin') state.page = 'admin-' + (h[1] || 'logs');
  else if (h[0] === 'g' && h[1]) {
    state.gid = h[1];
    const s = h[2] || '';
    if (s === '') state.page = 'overview';
    else if (s === 'tickets') state.page = h[3] === 'settings' ? 'tsettings' : 'tickets';
    else if (s === 'p' && h[3]) { state.page = 'panel'; state.pid = h[3]; state.tab = h[4] || 'message'; }
    else if (s === 'welcome') { state.page = 'welcome'; state.wtab = h[3] === 'leave' ? 'leave' : 'welcome'; }
    else if (['stats', 'purchases', 'users', 'auto'].includes(s)) state.page = s;
    else state.page = 'overview';
  }
  load();
}

async function load() {
  if (!state.pub) { try { state.pub = await api('/api/public'); } catch (e) { state.pub = { links: {} }; } }
  if (!state.me) {
    try { const j = await api('/api/me'); state.me = j.account; state.guilds = j.guilds; state.pub.discordLogin = j.discordLogin; } catch (e) { state.me = null; }
  }
  if (state.me && state.gid && (!state.data || state.data.guild.id !== state.gid)) {
    try { state.data = await api('/api/guild/' + state.gid); state.cache = {}; state.dirty = false; }
    catch (e) { toast(e.message, true); state.gid = null; state.data = null; location.hash = '#/'; return; }
  }
  render();
}

// ---------- 공통 화면 ----------
const T = () => state.data && state.data.tickets;
const C = () => state.data && state.data.community;
const curPanel = () => T() && T().panels.find((p) => p.id === state.pid);
const chName = (id) => { const c = state.data.channels.find((x) => x.id === id); return c ? '#' + c.name : ''; };
const L = () => (state.pub && state.pub.links) || {};

function renderTop() {
  const me = state.me, l = L();
  const links = `<a class="opt" ${ext(l.supportUrl)}>공식 디스코드 서버</a><a class="opt" ${ext(l.contactUrl)}>문의하기</a><a ${ext(l.inviteUrl)}>봇 초대하기</a>`;
  $('#top').innerHTML = `<header class="top"><div class="brand" data-go="#/"><img src="/icon.svg" alt="">SODDU SHOP <small>대시보드</small></div>
    <div class="toplinks">${links}${me ? `<span class="who">${me.avatar ? `<img src="${esc(me.avatar)}" alt="">` : ''}<span>${esc(me.name)}</span></span><button data-go="#/account">내 계정</button><button data-act="logout">로그아웃</button>` : `<button data-act="auth-open" data-mode="login">로그인</button>`}</div></header>`;
}

function render() {
  renderTop();
  const app = $('#app');
  if (!state.me) { $('#bar').innerHTML = ''; return renderLanding(app); }
  const sideHtml = renderSide();
  app.innerHTML = `<div class="shell"><aside class="card side">${sideHtml}</aside><main id="main"></main></div>`;
  renderMain();
}

function renderSide() {
  const me = state.me, p = state.page;
  const nb = (hash, label, on) => `<button class="${on ? 'on' : ''}" data-go="${hash}">${label}</button>`;
  let h = '';
  if (state.gid && state.data) {
    const g = state.data.guild, b = `#/g/${esc(g.id)}`;
    h += `<div class="g"><div class="gicon">${g.icon ? `<img src="${esc(g.icon)}" alt="">` : esc(g.name.slice(0, 1))}</div><div><b>${esc(g.name)}</b><span class="muted">관리 중</span></div></div><nav class="nav">
      ${nb(b, '🏠 개요', p === 'overview')}${nb(b + '/tickets', '🎫 티켓', ['tickets', 'tsettings', 'panel'].includes(p))}
      ${nb(b + '/stats', '📊 서버 통계', p === 'stats')}${nb(b + '/purchases', '🧾 구매 로그', p === 'purchases')}${nb(b + '/users', '👤 유저 정보', p === 'users')}
      ${nb(b + '/welcome', '👋 환영 / 퇴장', p === 'welcome')}${nb(b + '/auto', '💬 자동응답', p === 'auto')}
      <div class="sec">기타</div>${nb('#/', '← 서버 목록', false)}`;
  } else {
    h += `<div class="g"><div class="gicon">${me.avatar ? `<img src="${esc(me.avatar)}" alt="">` : esc((me.name || '?').slice(0, 1))}</div><div><b>${esc(me.name)}</b><span class="muted">${me.isAdmin ? '관리자' : '내 계정'}</span></div></div><nav class="nav">
      ${nb('#/', '🏠 서버 목록', p === 'home')}`;
  }
  h += `${nb('#/account', '⚙️ 내 계정', p === 'account')}`;
  if (me.isAdmin) {
    h += `<div class="sec">관리자 전용</div>${nb('#/admin/logs', '🛡️ 로그인 기록', p === 'admin-logs')}${nb('#/admin/accounts', '👥 계정 목록', p === 'admin-accounts')}${nb('#/admin/site', '🔗 첫 화면 링크', p === 'admin-site')}`;
  }
  return h + '</nav>';
}

function renderMain() {
  const main = $('#main'); if (!main) return;
  const p = state.page;
  const needGuild = !['home', 'account'].includes(p) && !p.startsWith('admin-');
  const showBar = ['panel', 'tsettings', 'welcome', 'auto'].includes(p);
  if (needGuild && (!state.gid || !state.data)) { main.innerHTML = '<div class="empty">불러오는 중...</div>'; $('#bar').innerHTML = ''; return; }
  if (showBar) renderBar(); else $('#bar').innerHTML = '';
  const fn = { home: pgHome, account: pgAccount, overview: pgOverview, tickets: pgTickets, tsettings: pgTSettings, panel: pgPanel, stats: pgStats, purchases: pgPurchases, users: pgUsers, welcome: pgWelcome, auto: pgAuto,
    'admin-logs': pgAdminLogs, 'admin-accounts': pgAdminAccounts, 'admin-site': pgAdminSite }[p];
  if (!fn) { main.innerHTML = '<div class="empty">페이지를 찾을 수 없어요.</div>'; return; }
  if (p === 'panel' && !curPanel()) { location.hash = `#/g/${state.gid}/tickets`; return; }
  fn(main);
}

    const panel = (title, d) => `<div class="card"><h2>${title}</h2><div class="grid s" style="margin-top:12px">

    const max = Math.max(1, ...s.daily.map((d) => d.spent));

document.addEventListener('input', (e) => {
  const t = e.target;
  if (!t.dataset || !t.dataset.p || t.type === 'checkbox' || t.type === 'radio') return;
  const o = scopeObj(t.dataset.s); if (!o) return;
  let v = t.value;
  if (t.dataset.t === 'num') v = Math.min(+t.max || 60, Math.max(+t.min || 1, parseInt(v, 10) || 1));
  setP(o, t.dataset.p, v);
  if (t.type === 'color' || /color$/i.test(t.dataset.p)) document.querySelectorAll(`[data-s="${t.dataset.s}"][data-p="${t.dataset.p}"]`).forEach((x) => { if (x !== t && /^#[0-9a-fA-F]{6}$/.test(v)) x.value = v; });
  markDirty(); refreshPreview();
  if (state.page === 'panel' && t.dataset.p === 'name') { const h = document.querySelector('#main h1'); if (h) h.textContent = v; }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (!t.dataset || !t.dataset.p) return;

  if (t.type === 'checkbox') setP(o, t.dataset.p, t.checked);

  else return;
  markDirty(); refreshPreview();
});

  const act = el.dataset.act;
  const T_ = T(), panels = T_ && T_.panels, p = state.pid ? curPanel() : null;

  if (act === 'auth-open') { e.preventDefault(); state.auth = el.dataset.mode; if (!state.me) renderLanding($('#app')); else go('#/'); window.scrollTo(0, 0); return; }
  if (act === 'logout') { try { await api('/api/auth/logout', { method: 'POST', body: '{}' }); } catch (_) {} state.me = null; state.data = null; state.guilds = []; state.dirty = false; location.hash = '#/'; render(); return; }
  if (act === 'tab') { state.tab = el.dataset.tab; history.replaceState(null, '', `#/g/${state.gid}/p/${state.pid}/${state.tab}`); renderMain(); return; }
  if (act === 'wtab') { state.wtab = el.dataset.tab; history.replaceState(null, '', `#/g/${state.gid}/welcome/${state.wtab}`); renderMain(); return; }
  if (act === 'mode') { if (p) { p.mode = el.value; markDirty(); renderTab(); const tabs = $('.tabs'); if (tabs) tabs.innerHTML = PTABS().map(([k, n]) => `<button class="${state.tab === k ? 'on' : ''}" data-act="tab" data-tab="${k}">${n}</button>`).join(''); } return; }
  if (act === 'new-panel') {
    if (panels.length >= 10) return toast('패널은 최대 10개까지 만들 수 있어요.', true);
    const np = JSON.parse(JSON.stringify(state.data.defaultPanel)); np.id = rid(); np.name = `패널 ${panels.length + 1}`;
    panels.push(np); state.dirty = true; state.tab = 'message'; location.hash = `#/g/${state.gid}/p/${np.id}/message`; return;
  }
  if (act === 'del-panel') {
    if (!confirm('이 패널을 삭제할까요? (이미 보낸 디스코드 메시지는 직접 지워야 해요)')) return;
    const i = panels.findIndex((x) => x.id === el.dataset.id); if (i >= 0) panels.splice(i, 1);
    await save(); renderMain(); return;
  }
  if (act === 'role') {
    const o = scopeObj(el.dataset.s); if (!o) return;
    const arr = getP(o, el.dataset.path); const i = arr.indexOf(el.dataset.id); if (i >= 0) arr.splice(i, 1); else arr.push(el.dataset.id);
    markDirty(); if (state.page === 'panel') renderTab(); else renderMain(); return;
  }
  if (act === 'list-add' || act === 'list-del' || act === 'list-up' || act === 'list-down') {
    const o = scopeObj(el.dataset.s); if (!o) return;
    const arr = getP(o, el.dataset.base); const i = +el.dataset.i;
    if (act === 'list-add') {
      const kind = el.dataset.kind;
      if (kind === 'question' && arr.length >= 5) return;
      if (kind === 'option' && arr.length >= 25) return;
      if (kind === 'responder' && arr.length >= 50) return toast('자동응답은 최대 50개예요.', true);
      arr.push(TEMPLATES[kind]());
    } else if (act === 'list-del') arr.splice(i, 1);
    else { const j = act === 'list-up' ? i - 1 : i + 1; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; }
    markDirty(); if (state.page === 'panel') renderTab(); else renderMain(); return;
  }
  if (act === 'save') { await save(); return; }
  if (act === 'send') {
    if (!p.channelId) return toast('패널을 보낼 채널을 먼저 선택해 주세요.', true);
    if (!(await save())) return;
    try {
      const r = await api(`/api/guild/${state.gid}/panels/${state.pid}/send`, { method: 'POST', body: '{}' });
      state.data.tickets = r.tickets;
      toast(r.created ? '패널을 보냈어요!' : '패널 메시지를 업데이트했어요!');
      if (state.tab === 'message') renderTab();
    } catch (err) { toast(err.message, true); }
    return;
  }
  if (act === 'wtest') {
    try { await api(`/api/guild/${state.gid}/community/preview`, { method: 'POST', body: JSON.stringify({ kind: state.wtab, draft: C()[state.wtab] }) }); toast('테스트 메시지를 보냈어요!'); }
    catch (err) { toast(err.message, true); }
    return;
  }
  if (act === 'user') { showUser(el.dataset.id); return; }
  if (act === 'user-save') {
    const box = $('#uform'); const body = {};
    box.querySelectorAll('[data-u]').forEach((i) => { body[i.dataset.u] = Number(i.value || 0); });
    try { await api(`/api/guild/${state.gid}/users/${box.dataset.id}`, { method: 'PUT', body: JSON.stringify(body) }); toast('저장했어요.'); state.cache = {}; showUser(box.dataset.id); }
    catch (err) { toast(err.message, true); }
    return;
  }
  if (act === 'acc-del') {
    if (!confirm('이 계정을 삭제할까요?')) return;
    try { await api(`/api/admin/accounts/${el.dataset.id}`, { method: 'DELETE' }); toast('삭제했어요.'); renderMain(); } catch (err) { toast(err.message, true); }
    return;
  }
  if (act === 'site-save') {
    const body = {}; document.querySelectorAll('[data-site]').forEach((i) => { body[i.dataset.site] = i.value.trim(); });
    try { const r = await api('/api/admin/site', { method: 'PUT', body: JSON.stringify(body) }); state.pub.links = r.effective; toast('저장했어요.'); renderTop(); renderMain(); }
    catch (err) { toast(err.message, true); }
  }
});

async function save() {
  if (state.busy) return false;
  state.busy = true;
  const isTickets = ['panel', 'tsettings', 'tickets'].includes(state.page);
  try {
    if (isTickets) {
      const r = await api(`/api/guild/${state.gid}/tickets`, { method: 'PUT', body: JSON.stringify({ settings: T().settings, panels: T().panels }) });
      state.data.tickets = r.tickets;
    } else {
      const r = await api(`/api/guild/${state.gid}/community`, { method: 'PUT', body: JSON.stringify(C()) });
      state.data.community = r.community;
    }
    state.dirty = false;
    state.cache = {};
    if (state.pid && !curPanel()) location.hash = `#/g/${state.gid}/tickets`;
    toast('저장했어요.');
    return true;
  } catch (err) { toast(err.message, true); return false; }
  finally {
    state.busy = false;
    if (['panel', 'tsettings', 'welcome', 'auto'].includes(state.page)) { renderBar(); if (state.page === 'auto') renderMain(); }
  }
}

route();
</script>
</body>
</html>
